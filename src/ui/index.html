<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>clihive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23e8a33d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="bg-layer" id="bg-layer" aria-hidden="true"></div>
<div id="app" class="shell">

  <!-- 36px custom titlebar. Center is the drag region. -->
  <header class="titlebar">
    <div class="titlebar-mantle">
      <span class="mark" aria-hidden="true"></span>
      <span class="app-name">clihive</span>
      <span class="ws-name" id="ws-name">main</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-status">
      <button class="vital" id="vital-running" hidden type="button" title="Jump to a running pane">
        <span class="vital-dot dot-running"></span><span id="vital-running-n">0</span> running
      </button>
      <button class="vital" id="vital-attention" hidden type="button" title="Jump to a pane that needs you">
        <span class="vital-dot dot-attention"></span><span id="vital-attention-n">0</span> need you
      </button>
      <span class="conn" id="status" data-state="">connecting…</span>
      <button class="icon-btn" id="open-settings" type="button" title="Appearance settings">&#9881;</button>
    </div>
  </header>

  <div class="body" id="body">

    <!-- 240px left sidebar: navigation only. -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="section-label">Workspaces</span>
        <button class="icon-btn" id="ws-add" type="button" title="New workspace">+</button>
      </div>
      <nav class="ws-list" id="ws-list" aria-label="Workspaces"></nav>
      <div class="sidebar-foot">
        <span id="ws-count">1 workspace</span>
        <button class="icon-btn" id="sidebar-hide" type="button" title="Hide sidebar">&#8249;</button>
      </div>
    </aside>

    <!-- Collapsed sidebar rail. -->
    <button class="sidebar-rail" id="sidebar-rail" type="button" title="Show sidebar" hidden>&#8250;</button>

    <!-- The hero: the terminal grid gets the largest area. -->
    <section class="hero">
      <div class="hero-toolbar">
        <button class="tbtn" id="add-pane" type="button">+ pane</button>
        <select id="new-pane-mode" class="mini-select" title="Delivery mode">
          <option value="display">display</option>
          <option value="stdin">stdin</option>
        </select>
        <span class="hero-spacer"></span>
        <button class="tbtn" id="open-palette" type="button" title="Command palette (Ctrl+K)">&#8984;K</button>
        <button class="tbtn" id="toggle-trace" type="button" aria-pressed="false">trace</button>
        <button class="tbtn tbtn-accent" id="toggle-orch" type="button" aria-pressed="false">orchestrator</button>
      </div>
      <div class="grid" id="grid" aria-label="CLI panes"></div>
      <p class="empty" id="grid-empty">
        <span id="grid-empty-text">No panes yet.</span> <button class="link" id="empty-add" type="button">Open the first CLI pane</button>.
      </p>
    </section>

    <!-- Right mission-control pillar: Fleet roster + Orchestrator + tabs. -->
    <aside class="deck" id="orchestrator" data-open="false" aria-label="Mission control">
      <nav class="deck-tabs" role="tablist">
        <button class="dtab is-active" data-tab="orch" role="tab" aria-selected="true" title="Orchestrator">&#9638;</button>
        <button class="dtab" data-tab="shared" role="tab" aria-selected="false" title="Shared transcript">&#9776;</button>
        <button class="dtab" data-tab="collab" role="tab" aria-selected="false" title="Managed agents &amp; runs">&#9881;&#65038;</button>
        <button class="dtab" data-tab="trace" role="tab" aria-selected="false" title="Trace">&#9881;</button>
        <span class="deck-tabs-spacer"></span>
        <button class="icon-btn" id="close-orch" type="button" aria-label="Hide panel">&times;</button>
      </nav>

      <!-- Fleet roster: status dot + name + activity + jump. -->
      <div class="fleet" id="fleet">
        <div class="fleet-head"><span class="section-label" id="fleet-label">Fleet &middot; 0</span></div>
        <div class="fleet-list" id="fleet-list"></div>
      </div>

      <div class="deck-panels">
        <div class="dpanel is-active" data-panel="orch" role="tabpanel">
          <div class="log" id="orch-log" aria-live="polite"></div>
        </div>
        <div class="dpanel" data-panel="shared" role="tabpanel">
          <div class="log" id="shared-log"></div>
        </div>
        <div class="dpanel" data-panel="collab" role="tabpanel">
          <div class="collab" id="collab-panel">
            <div class="collab-question" id="collab-question" hidden>
              <p class="collab-q-text" id="collab-q-text"></p>
              <div class="collab-q-row">
                <input class="input" id="collab-q-input" type="text" placeholder="Answer the agent&hellip;" />
                <button class="tbtn" id="collab-q-send" type="button">Respond</button>
              </div>
            </div>
            <details class="collab-sec" id="collab-agents-sec" open>
              <summary><span class="section-label" id="collab-agents-label">Agents &middot; 0</span></summary>
              <div class="collab-list" id="collab-agents"></div>
              <form class="collab-form" id="collab-agent-form">
                <select class="mini-select" id="ca-provider" aria-label="Provider">
                  <option value="codex">codex</option>
                  <option value="claude">claude</option>
                  <option value="opencode">opencode</option>
                </select>
                <input class="input" id="ca-model" type="text" placeholder="model (opencode only, provider/model)" />
                <select class="mini-select" id="ca-permission" aria-label="Permission profile">
                  <option value="read-only">read-only</option>
                  <option value="workspace-write">workspace-write</option>
                </select>
                <input class="input" id="ca-label" type="text" placeholder="label (optional)" />
                <input class="input" id="ca-cwd" type="text" placeholder="cwd (default: hive cwd)" />
                <button class="tbtn" type="submit">+ agent</button>
              </form>
            </details>
            <details class="collab-sec" id="collab-runs-sec" open>
              <summary><span class="section-label" id="collab-runs-label">Runs &middot; 0</span></summary>
              <div class="collab-list" id="collab-runs"></div>
              <form class="collab-form collab-form-run" id="collab-run-form">
                <input class="input" id="cr-objective" type="text" placeholder="Objective for a new run&hellip;" />
                <div class="collab-list" id="cr-agents"></div>
                <input class="input" id="cr-criteria" type="text" placeholder="acceptance criteria (; separated)" />
                <div class="collab-form-row">
                  <select class="mini-select" id="cr-permission" aria-label="Run permission">
                    <option value="read-only">read-only</option>
                    <option value="workspace-write">workspace-write</option>
                  </select>
                  <label class="collab-check"><input id="cr-plan" type="checkbox" /> model plans tasks</label>
                  <button class="tbtn tbtn-accent" type="submit">Start run</button>
                </div>
                <p class="collab-hint" id="cr-hint"></p>
              </form>
            </details>
            <details class="collab-sec" id="collab-tasks-sec" open>
              <summary><span class="section-label" id="collab-tasks-label">Tasks &middot; 0</span></summary>
              <div class="collab-list" id="collab-tasks"></div>
            </details>
            <details class="collab-sec" id="collab-events-sec">
              <summary><span class="section-label">Agent events</span></summary>
              <div class="log log-trace collab-events" id="collab-events"></div>
            </details>
          </div>
        </div>
        <div class="dpanel" data-panel="trace" role="tabpanel">
          <div class="trace-filter"><input class="input" id="trace-filter" type="search" placeholder="filter: msg. / pane. / orch." /></div>
          <div class="log log-trace" id="orch-trace"></div>
        </div>
      </div>

      <form class="composer" id="orch-form">
        <div class="composer-row">
          <select class="mini-select" id="orch-target" aria-label="Target"><option value="all">all panes</option></select>
          <span class="composer-hint" id="composer-hint">relays to every pane</span>
        </div>
        <textarea class="textarea" id="orch-input" rows="3" placeholder="Talk to the hive&hellip; (Enter to send)"></textarea>
        <button class="btn-primary" type="submit">Send</button>
      </form>
    </aside>
  </div>

  <!-- Bottom trace drawer. -->
  <section class="trace-drawer" id="trace-drawer" data-open="false" aria-label="Activity trace">
    <div class="drawer-head">
      <strong>Activity trace</strong>
      <span class="drawer-hint">every message, every delivery, every ack</span>
      <button class="icon-btn" id="close-trace" type="button" aria-label="Hide trace">&times;</button>
    </div>
    <div class="log log-trace" id="trace-log"></div>
  </section>

  <!-- Command palette. -->
  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <input class="palette-input" id="palette-input" type="text" placeholder="Type a command or search panes&hellip;" autocomplete="off" />
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <!-- Appearance settings. -->
  <div class="settings" id="settings" hidden>
    <div class="settings-box">
      <div class="settings-head">
        <strong>Appearance</strong>
        <button class="icon-btn" id="close-settings" type="button" aria-label="Close">&times;</button>
      </div>
      <label class="set-row">
        <span>Theme</span>
        <select class="mini-select" id="set-theme">
          <option value="amber">Amber graphite</option>
          <option value="matrix">Matrix</option>
          <option value="void">Void</option>
          <option value="neon">Neon</option>
        </select>
      </label>
      <label class="set-row">
        <span>Background image</span>
        <span class="set-file">
          <input id="set-bg" type="file" accept="image/*" />
        </span>
      </label>
      <label class="set-row">
        <span>Image fit</span>
        <select class="mini-select" id="set-bg-fit">
          <option value="cover">Fill (crop to window)</option>
          <option value="contain">Fit whole image (16:9)</option>
          <option value="fill">Stretch</option>
        </select>
      </label>
      <label class="set-row">
        <span>Image strength</span>
        <input id="set-bg-opacity" type="range" min="0" max="70" value="35" />
      </label>
      <label class="set-row">
        <span>CRT scanlines</span>
        <input id="set-scanlines" type="checkbox" />
      </label>
      <label class="set-row">
        <span>Glow effects</span>
        <input id="set-glow" type="checkbox" checked />
      </label>
      <button class="tbtn set-clear" id="set-bg-clear" type="button">Clear background image</button>
    </div>
  </div>
</div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
